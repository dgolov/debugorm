[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debugorm"
version = "0.1.0"
description = "A minimal, plugin-driven ORM for understanding and debugging SQL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["orm", "sqlite", "debug", "sql", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/dgolov/debugorm"
Repository = "https://github.com/dgolov/debugorm"
Issues = "https://github.com/dgolov/debugorm/issues"
Changelog = "https://github.com/dgolov/debugorm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["debugorm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["debugorm"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
